[project]
name = "gdcli-tool"
version = "0.1.0"
description = "AI-callable tooling for creating and iterating on Geometry Dash levels."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44.0",
    "mcp>=2.3,<3",
    "pyobjc-framework-Quartz>=11.0; sys_platform == 'darwin'",
]

[project.scripts]
gdcli = "gdaitrans.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdaitrans"]
